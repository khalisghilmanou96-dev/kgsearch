name: KSEARCHBOT world indexing

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: 'Zero-based batch number (leave empty for daily rotation)'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ksearch-world-indexing
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install -r crawler/requirements.txt
      - name: Crawl selected countries
        env:
          BATCH_NUMBER: ${{ inputs.batch_number }}
        run: |
          if [[ -n "$BATCH_NUMBER" ]]; then
            python crawler/world_runner.py --batch-size 8 --max-pages 20 --max-depth 1 --delay 2 --batch-number "$BATCH_NUMBER"
          else
            python crawler/world_runner.py --batch-size 8 --max-pages 20 --max-depth 1 --delay 2
          fi
      - name: Store generated index for review (not deployed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksearch-index-${{ github.run_id }}
          path: search/data/index.sqlite
          if-no-files-found: ignore
          retention-days: 7
