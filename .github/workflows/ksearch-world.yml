name: KSEARCHBOT world indexing

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: 'Zero-based batch number (leave empty for daily rotation)'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ksearch-world-indexing
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install -r crawler/requirements.txt
      - name: Configure SSH for IONOS
        if: success()
        env:
          SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.IONOS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ksearch_ionos
          chmod 600 ~/.ssh/ksearch_ionos
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Restore persistent frontier
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          mkdir -p crawler/data
          ssh -4 -i ~/.ssh/ksearch_ionos -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'test -d /home/www/kgsearch-deploy || exit 1'
          if ssh -4 -i ~/.ssh/ksearch_ionos -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'test -f /home/www/kgsearch-deploy/data/frontier.sqlite'; then
            scp -4 -i ~/.ssh/ksearch_ionos -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST:/kgsearch-deploy/data/frontier.sqlite" crawler/data/frontier.sqlite
            python -c 'import sqlite3; c=sqlite3.connect("crawler/data/frontier.sqlite"); assert c.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; c.close()'
          else
            echo "First execution: initializing frontier."
          fi
          python -c 'import sys; sys.path.insert(0,"crawler"); from frontier import connect,add_url; c=connect(); add_url(c,"https://visitwallonia.be/","BE"); add_url(c,"https://www.france.fr/fr/","FR"); c.close()'

      - name: Crawl persistent worldwide frontier
        env:
          KSEARCH_FRONTIER_DB: crawler/data/frontier.sqlite
          KSEARCH_INDEX_DB: search/data/index.sqlite
        run: |
          python crawler/frontier_runner.py --limit 20 --delay 2
          python crawler/sqlite_snapshot.py crawler/data/frontier.sqlite crawler/data/frontier-export.sqlite

      - name: Save persistent frontier to IONOS
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          python - <<'PYCHECK'
          import sqlite3
          from pathlib import Path
          db = Path("crawler/data/frontier-export.sqlite")
          if not db.is_file():
              raise SystemExit("Frontière exportée absente")
          with sqlite3.connect(db) as con:
              assert con.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              columns = {row[1] for row in con.execute("PRAGMA table_info(frontier)")}
              assert {"url", "status", "next_crawl_at"} <= columns
              assert con.execute("SELECT COUNT(*) FROM frontier").fetchone()[0] > 0
          print("Frontière exportée : valide")
          PYCHECK
          ssh -4 -i ~/.ssh/ksearch_ionos -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /home/www/kgsearch-deploy/data'
          scp -4 -i ~/.ssh/ksearch_ionos -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes crawler/data/frontier-export.sqlite "$SSH_USER@$SSH_HOST:/kgsearch-deploy/data/frontier-upload-${{ github.run_id }}-${{ github.run_attempt }}.sqlite"
          ssh -4 -i ~/.ssh/ksearch_ionos -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'python3 -c '"'"'import os,sqlite3; from pathlib import Path; p=Path("/home/www/kgsearch-deploy/data"); src=p/"frontier-upload-${{ github.run_id }}-${{ github.run_attempt }}.sqlite"; dst=p/"frontier.sqlite"; old=p/"frontier-previous.sqlite"; c=sqlite3.connect(src); assert c.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; assert c.execute("SELECT COUNT(*) FROM frontier").fetchone()[0]>0; c.close(); os.replace(dst,old) if dst.exists() else None; os.replace(src,dst)'"'"''
          echo "Persistent frontier saved safely."

      - name: Transfer SQLite index to IONOS
        if: success()
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          if [ ! -s search/data/index.sqlite ]; then
            echo "Nothing to transfer."
            exit 0
          fi

          scp -4 \
            -i ~/.ssh/ksearch_ionos \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            search/data/index.sqlite \
            "$SSH_USER@$SSH_HOST:/kgsearch-deploy/incoming/index-${{ github.run_id }}-${{ github.run_attempt }}.sqlite"

          echo "KSEARCH SQLite transfer completed."
      - name: Import validated SQLite into KSEARCHBOT production
        if: success()
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          if [ ! -s search/data/index.sqlite ]; then
            echo "No SQLite index: skipping import."
            exit 0
          fi

          ssh -4 \
            -i ~/.ssh/ksearch_ionos \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'python3 /home/www/kgsearch-deploy/crawler/import_production.py \
              --base /home/www/sitevitrine/search/data/index.sqlite \
              --incoming /home/www/kgsearch-deploy/incoming/index-${{ github.run_id }}-${{ github.run_attempt }}.sqlite \
              --backup-dir /home/www/kgsearch-deploy/backups \
              --lock-file /home/www/kgsearch-deploy/import.lock'

      - name: Verify GitHub SSH access to IONOS
        if: success()
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          ssh -4 \
            -i ~/.ssh/ksearch_ionos \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "KSEARCHBOT GITHUB SSH OK"; python3 --version'

      - name: Store generated index for review (not deployed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksearch-index-${{ github.run_id }}
          path: search/data/index.sqlite
          if-no-files-found: ignore
          retention-days: 7
