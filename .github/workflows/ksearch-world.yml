name: KSEARCHBOT world indexing

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: 'Zero-based batch number (leave empty for daily rotation)'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ksearch-world-indexing
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install -r crawler/requirements.txt
      - name: Discover country sources automatically
        run: |
          python crawler/auto_discover.py

      - name: Crawl selected countries
        env:
          BATCH_NUMBER: ${{ inputs.batch_number }}
        run: |
          if [[ -n "$BATCH_NUMBER" ]]; then
            python crawler/world_runner.py --batch-size 8 --max-pages 20 --max-depth 1 --delay 2 --batch-number "$BATCH_NUMBER"
          else
            python crawler/world_runner.py --batch-size 8 --max-pages 20 --max-depth 1 --delay 2
          fi
      - name: Configure SSH for IONOS
        if: success()
        env:
          SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.IONOS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ksearch_ionos
          chmod 600 ~/.ssh/ksearch_ionos
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer SQLite index to IONOS
        if: success()
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          if [ ! -s search/data/index.sqlite ]; then
            echo "Nothing to transfer."
            exit 0
          fi

          scp -4 \
            -i ~/.ssh/ksearch_ionos \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            search/data/index.sqlite \
            "$SSH_USER@$SSH_HOST:/kgsearch-deploy/incoming/index-${{ github.run_id }}-${{ github.run_attempt }}.sqlite"

          echo "KSEARCH SQLite transfer completed."
      - name: Import validated SQLite into KSEARCHBOT production
        if: success()
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          if [ ! -s search/data/index.sqlite ]; then
            echo "No SQLite index: skipping import."
            exit 0
          fi

          ssh -4 \
            -i ~/.ssh/ksearch_ionos \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'python3 /home/www/kgsearch-deploy/crawler/import_production.py \
              --base /home/www/sitevitrine/search/data/index.sqlite \
              --incoming /home/www/kgsearch-deploy/incoming/index-${{ github.run_id }}-${{ github.run_attempt }}.sqlite \
              --backup-dir /home/www/kgsearch-deploy/backups \
              --lock-file /home/www/kgsearch-deploy/import.lock'

      - name: Verify GitHub SSH access to IONOS
        if: success()
        env:
          SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
          SSH_USER: ${{ secrets.IONOS_SSH_USER }}
        run: |
          ssh -4 \
            -i ~/.ssh/ksearch_ionos \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "KSEARCHBOT GITHUB SSH OK"; python3 --version'

      - name: Store generated index for review (not deployed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksearch-index-${{ github.run_id }}
          path: search/data/index.sqlite
          if-no-files-found: ignore
          retention-days: 7
